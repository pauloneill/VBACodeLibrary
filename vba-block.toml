# vba-block.toml: aggregate manifest. Depends on every library module, so a consumer can
# pull in the whole library with one dependency. Each module has its own manifest in
# src/<module>/vba-block.toml and lists the other modules it needs. Add a line here as each
# module gets its manifest.
#
# Unverified: whether vba-blocks accepts a package that has only [dependencies] and no [src].
# If it does not, delete this file and depend on the modules directly.

[package]
name = "vba-code-library"
version = "0.1.0"
authors = ["Paul O'Neill"]

[dependencies]
vba-code-library-base = { path = "src/base" }

# Consumers can depend on a single module straight from git, e.g.:
# vba-code-library-base = { git = "https://github.com/pauloneill/VBACodeLibrary" }
# (a git dependency would need to locate the module inside the repo: unverified)
